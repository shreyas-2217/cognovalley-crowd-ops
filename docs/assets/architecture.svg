<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">CognoValley Track A system architecture</title>
  <desc id="desc">Video clips are decoded in a background Python worker, passed through YOLO11n and ByteTrack, measured per zone, evaluated by rules, stored in SQLite, and served to a vanilla JavaScript dashboard over MJPEG and JSON.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5d7386"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="#06090d"/>
  <rect x="0" y="0" width="1200" height="780" fill="url(#bg)"/>
  <defs>
    <radialGradient id="bg" cx="12%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <text x="40" y="46" fill="#e9f0f6" font-family="Segoe UI, Inter, sans-serif" font-size="22" font-weight="600">CognoValley Track A — system architecture</text>
  <text x="40" y="70" fill="#8ba0b3" font-family="Segoe UI, Inter, sans-serif" font-size="12">Crowd density and bottleneck analytics · one Python process, one browser tab, no cloud service</text>

  <!-- video sources -->
  <rect x="40" y="116" width="220" height="124" rx="12" fill="#0e151d" stroke="#1c2a37"/>
  <text x="58" y="142" fill="#22d3ee" font-family="Segoe UI, Inter, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.4">DEMO CLIP</text>
  <text x="58" y="164" fill="#e9f0f6" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">demo-crowd.webm</text>
  <text x="58" y="184" fill="#8ba0b3" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">960 × 540 · 30 fps · 35 s</text>
  <text x="58" y="202" fill="#8ba0b3" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">MOT17-04 night street</text>
  <text x="58" y="224" fill="#5d7386" font-family="Segoe UI, Inter, sans-serif" font-size="9.5">configs/demo.json</text>

  <rect x="40" y="258" width="220" height="124" rx="12" fill="#0e151d" stroke="#1c2a37"/>
  <text x="58" y="284" fill="#22d3ee" font-family="Segoe UI, Inter, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.4">BASELINE CLIP</text>
  <text x="58" y="306" fill="#e9f0f6" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">normal-corridor.avi</text>
  <text x="58" y="326" fill="#8ba0b3" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">768 × 576 · 10 fps · 79.5 s</text>
  <text x="58" y="344" fill="#8ba0b3" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">OpenCV vtest sample</text>
  <text x="58" y="366" fill="#5d7386" font-family="Segoe UI, Inter, sans-serif" font-size="9.5">configs/normal.json</text>

  <rect x="40" y="404" width="220" height="104" rx="12" fill="#0b1219" stroke="#1c2a37" stroke-dasharray="4 3"/>
  <text x="58" y="428" fill="#22d3ee" font-family="Segoe UI, Inter, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.4">CONFIGURATION</text>
  <text x="58" y="450" fill="#c8d6e2" font-family="Consolas, monospace" font-size="10.5">zones · capacity · colors</text>
  <text x="58" y="468" fill="#c8d6e2" font-family="Consolas, monospace" font-size="10.5">warning_ratio · alert_seconds</text>
  <text x="58" y="486" fill="#c8d6e2" font-family="Consolas, monospace" font-size="10.5">dwell_seconds · cooldown</text>
  <text x="58" y="500" fill="#c8d6e2" font-family="Consolas, monospace" font-size="10.5">target_fps · pixels_per_meter</text>

  <!-- worker -->
  <rect x="300" y="96" width="500" height="576" rx="14" fill="#0b1219" stroke="#1c2a37"/>
  <text x="320" y="124" fill="#22d3ee" font-family="Segoe UI, Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">PYTHON · BACKGROUND WORKER THREAD</text>

  <rect x="320" y="140" width="460" height="54" rx="9" fill="#111a24" stroke="#1f3040"/>
  <text x="336" y="162" fill="#e9f0f6" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="600">1 · Decode and letterbox</text>
  <text x="336" y="180" fill="#8ba0b3" font-family="Segoe UI, Inter, sans-serif" font-size="10">OpenCV VideoCapture → 1280×720 canvas (16:9), skips frames to ~10 fps</text>

  <rect x="320" y="210" width="460" height="54" rx="9" fill="#111a24" stroke="#1f3040"/>
  <text x="336" y="232" fill="#e9f0f6" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="600">2 · Detect people</text>
  <text x="336" y="250" fill="#8ba0b3" font-family="Segoe UI, Inter, sans-serif" font-size="10">Ultralytics YOLO11n · COCO class 0 · confidence 0.30 · CPU only</text>

  <rect x="320" y="280" width="460" height="54" rx="9" fill="#111a24" stroke="#1f3040"/>
  <text x="336" y="302" fill="#e9f0f6" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="600">3 · Track identities</text>
  <text x="336" y="320" fill="#8ba0b3" font-family="Segoe UI, Inter, sans-serif" font-size="10">ByteTrack → stable track IDs used by dwell timers and speed estimates</text>

  <rect x="320" y="350" width="460" height="54" rx="9" fill="#111a24" stroke="#1f3040"/>
  <text x="336" y="372" fill="#e9f0f6" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="600">4 · Measure each zone</text>
  <text x="336" y="390" fill="#8ba0b3" font-family="Segoe UI, Inter, sans-serif" font-size="10">Point-in-polygon on box centres → count, density, dwell time, speed</text>

  <rect x="320" y="420" width="460" height="54" rx="9" fill="#111a24" stroke="#1f3040"/>
  <text x="336" y="442" fill="#e9f0f6" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="600">5 · Apply rules</text>
  <text x="336" y="460" fill="#8ba0b3" font-family="Segoe UI, Inter, sans-serif" font-size="10">Warning ratio, capacity, dwell · duration debounce + per-rule cooldown</text>

  <line x1="550" y1="194" x2="550" y2="206" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.55" marker-end="url(#arrow)"/>
  <line x1="550" y1="264" x2="550" y2="276" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.55" marker-end="url(#arrow)"/>
  <line x1="550" y1="334" x2="550" y2="346" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.55" marker-end="url(#arrow)"/>
  <line x1="550" y1="404" x2="550" y2="416" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.55" marker-end="url(#arrow)"/>
  <line x1="550" y1="474" x2="550" y2="486" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.55" marker-end="url(#arrow)"/>
  <line x1="550" y1="544" x2="550" y2="556" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.55" marker-end="url(#arrow)"/>

  <rect x="320" y="490" width="460" height="54" rx="9" fill="#111a24" stroke="#1f3040"/>
  <text x="336" y="512" fill="#e9f0f6" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="600">6 · Persist evidence</text>
  <text x="336" y="530" fill="#8ba0b3" font-family="Segoe UI, Inter, sans-serif" font-size="10">Annotated JPEG snapshot + row in SQLite (events table)</text>

  <rect x="320" y="560" width="460" height="54" rx="9" fill="#0f2530" stroke="#22d3ee" stroke-opacity="0.45"/>
  <text x="336" y="582" fill="#e9f0f6" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="600">7 · Publish latest state</text>
  <text x="336" y="600" fill="#8ba0b3" font-family="Segoe UI, Inter, sans-serif" font-size="10">One lock protects the newest annotated JPEG, stats snapshot and heat grid</text>

  <rect x="320" y="628" width="460" height="28" rx="8" fill="#0a0f15" stroke="#15212c"/>
  <text x="336" y="646" fill="#5d7386" font-family="Segoe UI, Inter, sans-serif" font-size="9.5">The Flask request thread never runs inference — requests only read the published state.</text>

  <!-- flask -->
  <rect x="860" y="96" width="300" height="244" rx="14" fill="#0b1219" stroke="#1c2a37"/>
  <text x="880" y="124" fill="#22d3ee" font-family="Segoe UI, Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">FLASK · MAIN THREAD</text>
  <text x="880" y="152" fill="#c8d6e2" font-family="Consolas, monospace" font-size="10.5">GET  /video</text>
  <text x="1000" y="152" fill="#8ba0b3" font-family="Segoe UI, Inter, sans-serif" font-size="10">MJPEG stream</text>
  <text x="880" y="176" fill="#c8d6e2" font-family="Consolas, monospace" font-size="10.5">GET  /api/stats</text>
  <text x="1000" y="176" fill="#8ba0b3" font-family="Segoe UI, Inter, sans-serif" font-size="10">zones + heat grid</text>
  <text x="880" y="200" fill="#c8d6e2" font-family="Consolas, monospace" font-size="10.5">GET  /api/events</text>
  <text x="1000" y="200" fill="#8ba0b3" font-family="Segoe UI, Inter, sans-serif" font-size="10">recent log rows</text>
  <text x="880" y="224" fill="#c8d6e2" font-family="Consolas, monospace" font-size="10.5">POST /api/events/clear</text>
  <text x="1034" y="224" fill="#8ba0b3" font-family="Segoe UI, Inter, sans-serif" font-size="10">reset demo</text>
  <text x="880" y="248" fill="#c8d6e2" font-family="Consolas, monospace" font-size="10.5">GET  /snapshots/&lt;file&gt;</text>
  <text x="1034" y="248" fill="#8ba0b3" font-family="Segoe UI, Inter, sans-serif" font-size="10">evidence</text>
  <text x="880" y="272" fill="#c8d6e2" font-family="Consolas, monospace" font-size="10.5">GET  /static/*</text>
  <text x="1000" y="272" fill="#8ba0b3" font-family="Segoe UI, Inter, sans-serif" font-size="10">HTML · CSS · JS</text>
  <text x="880" y="304" fill="#5d7386" font-family="Segoe UI, Inter, sans-serif" font-size="9.5">SQLite is opened per operation with one write lock.</text>
  <text x="880" y="320" fill="#5d7386" font-family="Segoe UI, Inter, sans-serif" font-size="9.5">No ORM, no migration framework, one table.</text>

  <!-- browser -->
  <rect x="860" y="400" width="300" height="272" rx="14" fill="#0b1219" stroke="#1c2a37"/>
  <text x="880" y="428" fill="#22d3ee" font-family="Segoe UI, Inter, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">BROWSER · VANILLA JS</text>
  <circle cx="888" cy="452" r="3" fill="#34d399"/>
  <text x="900" y="456" fill="#c8d6e2" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">&lt;img&gt; MJPEG · annotated frames</text>
  <circle cx="888" cy="476" r="3" fill="#34d399"/>
  <text x="900" y="480" fill="#c8d6e2" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">1 s stats poll · 2 s events poll</text>
  <circle cx="888" cy="500" r="3" fill="#34d399"/>
  <text x="900" y="504" fill="#c8d6e2" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">SVG zone polygons (click to filter)</text>
  <circle cx="888" cy="524" r="3" fill="#34d399"/>
  <text x="900" y="528" fill="#c8d6e2" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">Canvas heatmap · 32 × 18 grid</text>
  <circle cx="888" cy="548" r="3" fill="#34d399"/>
  <text x="900" y="552" fill="#c8d6e2" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">Chart.js headcount trend</text>
  <circle cx="888" cy="572" r="3" fill="#34d399"/>
  <text x="900" y="576" fill="#c8d6e2" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">Event log · filters · evidence</text>
  <circle cx="888" cy="596" r="3" fill="#34d399"/>
  <text x="900" y="600" fill="#c8d6e2" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">Stale-stream and offline states</text>
  <text x="880" y="632" fill="#5d7386" font-family="Segoe UI, Inter, sans-serif" font-size="9.5">Rendering is plain DOM updates; no framework,</text>
  <text x="880" y="648" fill="#5d7386" font-family="Segoe UI, Inter, sans-serif" font-size="9.5">no build step, no bundler.</text>

  <!-- arrows -->
  <line x1="260" y1="180" x2="316" y2="170" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="260" y1="320" x2="316" y2="236" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="260" y1="456" x2="316" y2="394" stroke="#5d7386" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-dim)"/>

  <line x1="800" y1="196" x2="856" y2="196" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="806" y="188" fill="#8ba0b3" font-family="Segoe UI, Inter, sans-serif" font-size="9.5">JPEG + stats</text>

  <line x1="1010" y1="340" x2="1010" y2="396" stroke="#22d3ee" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="1020" y="373" fill="#8ba0b3" font-family="Segoe UI, Inter, sans-serif" font-size="9.5">HTTP</text>

  <line x1="940" y1="400" x2="940" y2="344" stroke="#5d7386" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-dim)"/>
  <text x="900" y="373" fill="#5d7386" font-family="Segoe UI, Inter, sans-serif" font-size="9.5">poll</text>

  <text x="40" y="742" fill="#5d7386" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">Everything runs locally on CPU. Optional paths: a webcam index can replace the clip, and YOLOX can replace YOLO11n if a permissive licence is required.</text>
  <text x="40" y="760" fill="#5d7386" font-family="Segoe UI, Inter, sans-serif" font-size="10.5">Sources: MOT17-04-SDP (CC BY-NC-SA 3.0) and the OpenCV vtest sample. See data/clips/CREDITS.md.</text>
</svg>
